# Configuration Nav2 minimale pour robot Mecanum HOLONOME (~30 cm) — ROS2 Humble.
# Base saine, PAS optimisée : à affiner sur le robot réel.
#
# Prérequis :
#   sudo apt install ros-humble-navigation2 ros-humble-nav2-bringup \
#                    ros-humble-nav2-mppi-controller
#
# Lancement type (sur une carte sauvegardée) :
#   ros2 launch nav2_bringup bringup_launch.py \
#     map:=$HOME/maps/ma_carte.yaml \
#     params_file:=$(ros2 pkg prefix slam_robot_bringup)/share/slam_robot_bringup/config/nav2_params.yaml
#
# Points clés holonome :
#   - AMCL       : OmniMotionModel
#   - Controller : MPPI avec motion_model "Omni" (vitesse latérale vy autorisée)
#     Alternative sans package supplémentaire : DWB avec min_vel_y/max_vel_y ≠ 0.

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    # Modèle de mouvement OMNIDIRECTIONNEL (Mecanum)
    robot_model_type: "nav2_amcl::OmniMotionModel"
    # Bruits du modèle (défauts raisonnables, à ajuster si la localisation dérive)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # Portées du laser : cohérentes avec le YDLIDAR X2
    laser_max_range: 12.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 60
    # Population de particules
    min_particles: 500
    max_particles: 2000
    # Seuils de mise à jour du filtre (petit robot => seuils bas)
    update_min_d: 0.10        # m
    update_min_a: 0.15        # rad
    resample_interval: 1
    transform_tolerance: 0.5  # Large tant que l'odométrie Arduino n'est pas calibrée
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    set_initial_pose: false   # Pose initiale à donner dans RViz ("2D Pose Estimate")

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom         # Publié par l'Arduino via micro-ROS
    bt_loop_duration: 10
    default_server_timeout: 20
    # Les arbres de comportement par défaut de nav2_bt_navigator conviennent

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    # Holonome : NE PAS filtrer la vitesse latérale vy
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10   # m — tolérance d'arrivée en position
      yaw_goal_tolerance: 0.15  # rad — tolérance d'arrivée en orientation

    # --- Controller MPPI en mode omnidirectionnel ---
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"      # LE réglage clé pour Mecanum : autorise vy
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000          # Réduit (défaut 2000) pour ménager le CPU du CAPA55R
      # Écarts-types d'échantillonnage des vitesses
      vx_std: 0.2
      vy_std: 0.2               # ≠ 0 uniquement en holonome
      wz_std: 0.4
      # Limites de vitesse — TODO: À MESURER/VALIDER avec les moteurs JGB37-520
      vx_max: 0.3               # m/s
      vx_min: -0.15             # m/s (marche arrière)
      vy_max: 0.3               # m/s (translation latérale)
      wz_max: 1.0               # rad/s
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      visualize: false          # true pour déboguer les trajectoires dans RViz
      # Critiques : PreferForwardCritic volontairement ABSENT — un robot
      # holonome n'a pas de sens "préféré" de déplacement.
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        collision_cost: 10000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        threshold_to_consider: 0.4
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.6
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.4

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true      # Fenêtre glissante centrée sur le robot
      width: 3                  # m — 3x3 m suffit pour un petit robot indoor
      height: 3
      resolution: 0.05          # Même résolution que la carte SLAM
      # Rayon du robot : ~30 cm de large => 0.15 m + marge
      robot_radius: 0.18        # TODO: À MESURER (m, diagonale châssis/2 + marge)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45      # m — distance de "répulsion" autour des obstacles
        cost_scaling_factor: 3.0    # Plus grand = coût qui décroît plus vite
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      robot_radius: 0.18        # TODO: À MESURER — même valeur que local_costmap
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"  # Planificateur global simple et robuste
      tolerance: 0.25
      use_astar: false          # Dijkstra (défaut) — A* pas nécessaire ici
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Vitesses [vx, vy, wz] — vy ≠ 0 car holonome.
    # TODO: À MESURER/VALIDER avec les moteurs réels
    max_velocity: [0.3, 0.3, 1.0]
    min_velocity: [-0.3, -0.3, -1.0]
    max_accel: [1.0, 1.0, 2.0]
    max_decel: [-1.0, -1.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
