# Minimal Nav2 configuration for a HOLONOMIC Mecanum robot (~30 cm) -- ROS2 Humble.
# Sane base, NOT optimized: to be refined on the real robot.
#
# Prerequisites:
#   sudo apt install ros-humble-navigation2 ros-humble-nav2-bringup \
#                    ros-humble-nav2-mppi-controller
#
# Typical launch (on a saved map):
#   ros2 launch nav2_bringup bringup_launch.py \
#     map:=$HOME/maps/my_map.yaml \
#     params_file:=$(ros2 pkg prefix slam_robot_bringup)/share/slam_robot_bringup/config/nav2_params.yaml
#
# Key holonomic points:
#   - AMCL       : OmniMotionModel
#   - Controller : MPPI with motion_model "Omni" (lateral velocity vy allowed)
#     Alternative without an extra package: DWB with min_vel_y/max_vel_y != 0.

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    # OMNIDIRECTIONAL motion model (Mecanum)
    robot_model_type: "nav2_amcl::OmniMotionModel"
    # Model noises (reasonable defaults, adjust if localization drifts)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # Laser ranges: consistent with the YDLIDAR X2
    laser_max_range: 12.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 60
    # Particle population
    min_particles: 500
    max_particles: 2000
    # Filter update thresholds (small robot => low thresholds)
    update_min_d: 0.10        # m
    update_min_a: 0.15        # rad
    resample_interval: 1
    transform_tolerance: 0.5  # Large while the Arduino odometry is not calibrated
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    set_initial_pose: false   # Initial pose to be given in RViz ("2D Pose Estimate")

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom         # Published by the Arduino via the serial bridge
    bt_loop_duration: 10
    default_server_timeout: 20
    # The default nav2_bt_navigator behavior trees are fine

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    # Holonomic: do NOT filter the lateral velocity vy
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10   # m -- position arrival tolerance
      yaw_goal_tolerance: 0.15  # rad -- orientation arrival tolerance

    # --- MPPI controller in omnidirectional mode ---
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"      # THE key setting for Mecanum: allows vy
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000          # Reduced (default 2000) to spare the CAPA55R CPU
      # Velocity sampling standard deviations
      vx_std: 0.2
      vy_std: 0.2               # != 0 only in holonomic mode
      wz_std: 0.4
      # Velocity limits -- TODO: MEASURE/VALIDATE with the JGB37-520 motors
      vx_max: 0.3               # m/s
      vx_min: -0.15             # m/s (reverse)
      vy_max: 0.3               # m/s (lateral translation)
      wz_max: 1.0               # rad/s
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      visualize: false          # true to debug the trajectories in RViz
      # Critics: PreferForwardCritic intentionally ABSENT -- a holonomic robot
      # has no "preferred" direction of travel.
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        collision_cost: 10000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        threshold_to_consider: 0.4
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.6
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.4

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true      # Sliding window centered on the robot
      width: 3                  # m -- 3x3 m is enough for a small indoor robot
      height: 3
      resolution: 0.05          # Same resolution as the SLAM map
      # Robot radius: ~30 cm wide => 0.15 m + margin
      robot_radius: 0.18        # TODO: MEASURE (m, chassis diagonal/2 + margin)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45      # m -- "repulsion" distance around obstacles
        cost_scaling_factor: 3.0    # Larger = cost decays faster
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      robot_radius: 0.18        # TODO: MEASURE -- same value as local_costmap
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"  # Simple and robust global planner
      tolerance: 0.25
      use_astar: false          # Dijkstra (default) -- A* not needed here
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Velocities [vx, vy, wz] -- vy != 0 because holonomic.
    # TODO: MEASURE/VALIDATE with the real motors
    max_velocity: [0.3, 0.3, 1.0]
    min_velocity: [-0.3, -0.3, -1.0]
    max_accel: [1.0, 1.0, 2.0]
    max_decel: [-1.0, -1.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
