# YDLIDAR X2 configuration (UART/USB adapter box).
# Based on the official X2.yaml profile from the ydlidar_ros2_driver package,
# copied here so it can be edited without touching the driver package.
ydlidar_ros2_driver_node:
  ros__parameters:
    # --- Serial connection ---
    port: /dev/ttyUSB0        # USB port (check with: ls /dev/ttyUSB*)
    baudrate: 115200          # Fixed baudrate of the X2
    lidar_type: 1             # 1 = triangulation LiDAR (X2/X4 family)
    device_type: 0            # 0 = serial connection
    isSingleChannel: true     # The X2 is single-channel (no motor command feedback)
    auto_reconnect: true      # Auto-reconnect if the port drops

    # --- Sampling ---
    sample_rate: 3            # 3 kHz = 3000 samples/s (fixed for the X2)
    abnormal_check_count: 4
    fixed_resolution: true    # Fixed angular resolution in the /scan message

    # --- Orientation ---
    reversion: false          # true = adds 180 deg (if the LiDAR is mounted upside down)
    inverted: false           # true = reverses the angle rotation direction
    support_motor_dtr: true   # Motor control via the DTR pin (X2 adapter)

    # --- Intensity (not supported by the X2) ---
    intensity: false
    intensity_bit: 0

    # --- Field of view and range ---
    angle_min: -180.0         # Full 360 deg field
    angle_max: 180.0
    range_min: 0.1            # Minimum range of the X2 (m)
    range_max: 12.0           # Maximum range of the X2 (m) -- mirrored in slam_params.yaml
    ignore_array: ""          # Angular sectors to mask, e.g. "-90,-80" (cables, posts)

    # --- Misc ---
    frequency: 10.0           # Target rotation frequency (Hz) -- the single-channel X2
                              # actually spins at its own speed (~6-8 Hz)
    frame_id: laser_frame     # TF frame of the scans -- must match the URDF
    invalid_range_is_inf: false
    debug: false
